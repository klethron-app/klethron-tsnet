name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whitespace and shell scripts
        run: |
          git diff --check HEAD^ HEAD
          shellcheck .github/*.sh
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read pinned toolchains
        id: versions
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('gradle/libs.versions.toml', 'rb') as source:
              versions = tomllib.load(source)['versions']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('buildJdk', 'buildTools', 'commandLineToolsBuild', 'ndk'):
                  print(f'{key}={versions[key]}', file=output)
              print(f"platform=android-{versions['compileSdk']}.{versions['compileSdkMinor']}", file=output)
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.buildJdk }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tsnet/src/main/go/go.mod
          cache-dependency-path: tsnet/src/main/go/go.sum
      - name: Check Go formatting
        run: |
          gofmt -d tsnet/src/main/go
          test -z "$(gofmt -l tsnet/src/main/go)"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ steps.versions.outputs.commandLineToolsBuild }}
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchains
        env:
          PLATFORM: ${{ steps.versions.outputs.platform }}
          BUILD_TOOLS: ${{ steps.versions.outputs.buildTools }}
          NDK: ${{ steps.versions.outputs.ndk }}
          COMMAND_LINE_TOOLS: ${{ steps.versions.outputs.commandLineToolsBuild }}
        run: |
          sdkmanager "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK"
          # emulator-runner prepends this path; replace the runner's older tools with our pin.
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled"
          ln -s "$COMMAND_LINE_TOOLS" "$ANDROID_HOME/cmdline-tools/latest"
      - name: Build and verify local publication
        run: ./gradlew --no-daemon build :tsnet:publishReleasePublicationToLocalBuildRepository
      - name: Verify incremental build and configuration cache
        id: incremental
        run: |
          log=$RUNNER_TEMP/gradle-repeat.log
          ./gradlew --no-daemon --console=plain build :tsnet:publishReleasePublicationToLocalBuildRepository | tee "$log"
          grep -Fx 'Reusing configuration cache.' "$log"
          test "$(grep -Ec '^> Task :tsnet:buildGo(Arm64|X86_64)(Debug)? UP-TO-DATE$' "$log")" -eq 4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android 14 (API 34, 4 KiB pages)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: api34
          ram-size: 2048M
          emulator-build: 15507667 # 36.6.11
          script: .github/android-tests.sh 34 4096
      - name: Test Android 17 (API 37.2, 16 KiB pages)
        if: ${{ !cancelled() && steps.incremental.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.2'
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          avd-name: api37_2_16k
          ram-size: 2048M
          emulator-build: 15507667 # 36.6.11
          script: .github/android-tests.sh 37 16384
      - name: Save the release publication
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-release
          path: build/maven/
          if-no-files-found: error
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            tsnet/build/reports/
            demo/build/reports/
            build/emulator-tests/
          if-no-files-found: warn

  # Release tags only. Secrets live in the protected maven-central environment, and this job runs no
  # build code. Approving it publishes irreversibly once Central validates the upload.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: maven-central
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maven-release
          path: maven
      - name: Sign the bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: .github/central-bundle.sh "${GITHUB_REF_NAME#v}" maven bundle.zip
      - name: Publish through the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          api=https://central.sonatype.com/api/v1/publisher
          auth="Authorization: Bearer $(printf %s "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" | base64 -w0)"
          central() { curl --fail-with-body --silent --show-error -H @<(printf '%s\n' "$auth") "$@"; }
          id=$(central -F bundle=@bundle.zip "$api/upload?name=tsnet-${GITHUB_REF_NAME#v}&publishingType=AUTOMATIC")
          for _ in $(seq 300); do
            # Retry only the idempotent status call: a repeated upload would create another deployment.
            status=$(central --retry 5 --retry-all-errors -X POST "$api/status?id=$id")
            case $(jq -r .deploymentState <<<"$status") in
              PUBLISHED) echo "Deployment $id published"; exit 0 ;;
              FAILED) jq .errors <<<"$status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment $id not published after 50 minutes; see https://central.sonatype.com/publishing/deployments" >&2
          exit 1
