name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whitespace and shell scripts
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          shellcheck .github/*.sh
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint GitHub Actions workflows
        uses: docker://ghcr.io/kjanat/actionlint@sha256:c0a63b3e5c974c2466ead39404b70e448176beaff8c5ec7af0b2e96191aea661 # 1.17.1
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1 (zizmor 1.32.0)
        with:
          # Fail on findings instead of uploading SARIF, which needs security-events: write.
          advanced-security: false
          annotations: true

  build:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned toolchains
        id: versions
        run: >-
          sed -nE 's/^(buildJdk|buildTools|commandLineToolsBuild|ndk|compileSdk|compileSdkMinor) = "(.+)"$/\1=\2/p'
          gradle/libs.versions.toml >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.buildJdk }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tsnet/src/main/go/go.mod
          # Only v* tags can publish; those builds never restore shared caches.
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') }} # zizmor: ignore[cache-poisoning]
          cache-dependency-path: tsnet/src/main/go/go.sum
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/v') }} # zizmor: ignore[cache-poisoning]
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: false # Already checked by validate.
          add-job-summary: on-failure
      - name: Check Go formatting
        run: |
          files=$(gofmt -l tsnet/src/main/go)
          if [[ -n $files ]]; then
            printf 'Run gofmt on:\n%s\n' "$files" >&2
            exit 1
          fi
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: ${{ steps.versions.outputs.commandLineToolsBuild }}
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchains
        env:
          PLATFORM: android-${{ steps.versions.outputs.compileSdk }}.${{ steps.versions.outputs.compileSdkMinor }}
          BUILD_TOOLS: ${{ steps.versions.outputs.buildTools }}
          NDK: ${{ steps.versions.outputs.ndk }}
          COMMAND_LINE_TOOLS: ${{ steps.versions.outputs.commandLineToolsBuild }}
        run: |
          sdkmanager "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK"
          # emulator-runner prepends this path; replace the runner's older tools with our pin.
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled"
          ln -s "$COMMAND_LINE_TOOLS" "$ANDROID_HOME/cmdline-tools/latest"
      - name: Build and verify local publication
        run: ./gradlew build :tsnet:publishReleasePublicationToLocalBuildRepository
      - name: Verify incremental build and configuration cache
        id: incremental
        run: |
          set -o pipefail
          log=$RUNNER_TEMP/gradle-repeat.log
          ./gradlew --console=plain build :tsnet:publishReleasePublicationToLocalBuildRepository | tee "$log"
          grep -Fx 'Reusing configuration cache.' "$log"
          test "$(grep -Ec '^> Task :tsnet:buildGo(Arm64|X86_64)(Debug)? UP-TO-DATE$' "$log")" -eq 4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android 14 (API 34, 4 KiB pages)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: api34
          ram-size: 2048M
          emulator-build: 16740729 # 37.2.13
          script: .github/android-tests.sh 34 4096
      - name: Test Android 17 (API 37.2, 16 KiB pages)
        if: ${{ !cancelled() && steps.incremental.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.2'
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          avd-name: api37_2_16k
          ram-size: 2048M
          emulator-build: 16740729 # 37.2.13
          script: .github/android-tests.sh 37 16384
      - name: Save the release publication
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-release
          path: build/maven/
          if-no-files-found: error
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            tsnet/build/reports/
            demo/build/reports/
            build/emulator-tests/

  # Signing and publishing need approval in the maven-central environment.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: maven-central
    permissions:
      contents: write # Creates the GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Finds the previous tag.
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-release
          path: maven
      - name: Sign the bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: .github/central-bundle.sh "${GITHUB_REF_NAME#v}" maven bundle.zip
      - name: Publish through the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          api=https://central.sonatype.com/api/v1/publisher
          auth="Authorization: Bearer $(printf %s "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" | base64 -w0)"
          central() { curl --fail-with-body --silent --show-error -H @<(printf '%s\n' "$auth") "$@"; }
          id=$(central -F bundle=@bundle.zip "$api/upload?name=tsnet-${GITHUB_REF_NAME#v}&publishingType=AUTOMATIC")
          for _ in $(seq 300); do
            # Retry only the idempotent status call: a repeated upload would create another deployment.
            status=$(central --retry 5 --retry-all-errors -X POST "$api/status?id=$id")
            case $(jq -r .deploymentState <<<"$status") in
              PUBLISHED) echo "Deployment $id published"; exit 0 ;;
              FAILED) jq .errors <<<"$status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment $id not published after 50 minutes; see https://central.sonatype.com/publishing/deployments" >&2
          exit 1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Klethron tsnet $version" --notes \
            "[Changes since $previous](https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME) · [Javadoc](https://javadoc.io/doc/com.klethron/tsnet/$version/) · [Maven Central](https://central.sonatype.com/artifact/com.klethron/tsnet/$version)"

  javadoc:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import the published Javadoc
        run: bash .github/import-javadoc.sh "${GITHUB_REF_NAME#v}"
